openapi: 3.0.3
info:
  title: CLISENSA API
  description: API REST de la plataforma multi-hospital de citas médicas CLISENSA.
  version: 0.5.0
servers:
  - url: http://localhost:4000/api
    description: Desarrollo local
tags:
  - name: Auth
  - name: Hospitales
  - name: Administración
  - name: Servicios
  - name: Medicos
  - name: Horarios
  - name: Citas

paths:
  /hospitales:
    get:
      tags: [Hospitales]
      summary: Listar hospitales disponibles para agendar
      responses:
        "200":
          description: Lista de hospitales con logos opcionales
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    nombre: { type: string }
                    direccion: { type: string }
                    telefono: { type: string }
                    logoUrl: { type: string, format: uri, nullable: true }

  /admin/hospitales:
    post:
      tags: [Administración]
      summary: Crear hospital (ADMIN_SISTEMA)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, direccion, telefono]
              properties:
                nombre: { type: string }
                direccion: { type: string }
                telefono: { type: string }
                logoUrl: { type: string, format: uri }
      responses:
        "201": { description: Hospital creado }
        "403": { description: Rol no autorizado }

  /admin/personal:
    post:
      tags: [Administración]
      summary: Crear personal administrativo para un hospital (ADMIN_SISTEMA)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hospitalId, nombre, correo, password]
              properties:
                hospitalId: { type: integer }
                nombre: { type: string }
                correo: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: Cuenta administrativa creada }
        "404": { description: Hospital no encontrado }

  /hospital/servicios:
    get:
      tags: [Servicios]
      summary: Listar servicios de un hospital
      parameters:
        - in: query
          name: hospitalId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Catálogo de servicios }
    post:
      tags: [Servicios]
      summary: Crear servicio en el hospital del personal autenticado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, duracionMin, precio]
              properties:
                nombre: { type: string }
                duracionMin: { type: integer, minimum: 5 }
                precio: { type: number, minimum: 0 }
      responses:
        "201": { description: Servicio creado }
        "403": { description: Rol no autorizado }

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión y obtener un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password]
              properties:
                correo: { type: string, format: email, example: paciente@demo.com }
                password: { type: string, example: "1234" }
      responses:
        "200":
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaAutenticacion"
        "400": { description: Faltan credenciales }
        "401": { description: Credenciales inválidas }

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar paciente e iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo, password, cedula]
              properties:
                nombre: { type: string, example: Ana Paciente }
                correo: { type: string, format: email, example: ana@example.com }
                password: { type: string, minLength: 8, example: "ejemplo-seguro" }
                cedula: { type: string, description: Identificador requerido del paciente }
      responses:
        "201":
          description: Paciente registrado y autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaAutenticacion"
        "400": { description: Faltan campos requeridos o el correo tiene formato inválido }
        "409": { description: El correo o la cédula ya están registrados }

  /auth/perfil:
    get:
      tags: [Auth]
      summary: Consultar el perfil de la cuenta autenticada
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Datos del perfil autenticado }
        "401": { description: Falta autenticación }
    put:
      tags: [Auth]
      summary: Actualizar datos personales, foto o contraseña
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo]
              properties:
                nombre: { type: string }
                correo: { type: string, format: email }
                cedula: { type: string, description: Requerida para pacientes }
                fotoUrl: { type: string, format: uri, nullable: true }
                passwordActual: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200": { description: Perfil actualizado }
        "400": { description: Datos inválidos o contraseña actual incorrecta }
        "409": { description: El correo o la cédula ya están registrados }

  /medicos:
    get:
      tags: [Medicos]
      summary: Listar médicos y sus horarios base
      parameters:
        - in: query
          name: especialidad
          schema: { type: string }
        - in: query
          name: hospitalId
          schema: { type: integer }
      responses:
        "200":
          description: Lista de médicos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicoConHorarios"

  /medicos/invitar:
    post:
      tags: [Medicos]
      summary: Invitar médico y enviar enlace de activación
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [licenciaMedica, correo, especialidad]
              properties:
                licenciaMedica: { type: string }
                correo: { type: string, format: email }
                especialidad: { type: string }
      responses:
        "201": { description: Invitación enviada }
        "409": { description: El correo o la licencia ya existe }
        "503": { description: Configuración de correo incompleta }

  /medicos/perfil:
    get:
      tags: [Medicos]
      summary: Consultar perfil del médico autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Perfil médico }
    put:
      tags: [Medicos]
      summary: Completar perfil, activar cuenta o actualizar perfil del médico
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombreCompleto: { type: string }
                biografia: { type: string }
                fotoUrl: { type: string, format: uri, nullable: true }
                password: { type: string, minLength: 8 }
      responses:
        "200": { description: Perfil actualizado }
        "401": { description: Token de activación inválido o vencido }
    post:
      tags: [Medicos]
      summary: Crear médico (rol administrativo)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, especialidad]
              properties:
                nombre: { type: string, example: Dra. L. Torres }
                especialidad: { type: string, example: Ginecologia }
      responses:
        "201":
          description: Médico creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medico"
        "400": { description: Faltan campos requeridos }
        "401": { description: Falta autenticación }
        "403": { description: Se requiere rol administrativo }

  /medicos/{id}/horarios:
    post:
      tags: [Medicos]
      summary: Agregar horario base a un médico (rol administrativo)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hora]
              properties:
                hora: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$", example: "09:00" }
      responses:
        "201":
          description: Horario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HorarioBase"
        "400": { description: La hora falta o tiene formato inválido }
        "401": { description: Falta autenticación }
        "403": { description: Se requiere rol administrativo }
        "404": { description: Médico no encontrado }
        "409": { description: El horario ya existe }

  /medicos/{id}/horarios/{horarioId}:
    delete:
      tags: [Medicos]
      summary: Quitar horario base de un médico (rol administrativo)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: horarioId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Horario eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "401": { description: Falta autenticación }
        "403": { description: Se requiere rol administrativo }
        "404": { description: Horario no encontrado para ese médico }

  /horarios/disponibles:
    get:
      tags: [Horarios]
      summary: Consultar horarios libres de un médico en una fecha
      parameters:
        - in: query
          name: medicoId
          required: true
          schema: { type: integer }
        - in: query
          name: fecha
          required: true
          schema: { type: string, format: date, example: "2026-09-30" }
        - in: query
          name: servicioId
          schema: { type: integer }
      responses:
        "200":
          description: Horarios disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  medicoId: { type: integer }
                  fecha: { type: string, format: date }
                  disponibles:
                    type: array
                    items: { type: string, example: "09:00" }
        "400": { description: Parámetros requeridos faltantes o inválidos }

  /horarios:
    get:
      tags: [Horarios]
      summary: Consultar disponibilidad semanal del médico autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Bloques semanales configurados }
    post:
      tags: [Horarios]
      summary: Reemplazar disponibilidad semanal del médico autenticado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disponibilidad]
              properties:
                disponibilidad:
                  type: array
                  items:
                    type: object
                    required: [diaSemana, horaInicio, horaFin]
                    properties:
                      diaSemana: { type: integer, minimum: 0, maximum: 6 }
                      horaInicio: { type: string, example: "08:00" }
                      horaFin: { type: string, example: "12:00" }
      responses:
        "200": { description: Disponibilidad guardada }

  /citas:
    post:
      tags: [Citas]
      summary: Paciente reserva o médico asigna una cita directamente
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medicoId, hospitalId, fecha, hora]
              properties:
                medicoId: { type: integer, example: 1 }
                fecha: { type: string, format: date, example: "2026-09-30" }
                hora: { type: string, example: "09:00" }
                hospitalId: { type: integer }
                servicioId: { type: integer }
                pacienteId: { type: integer, description: Identificador del paciente en asignaciones médicas }
                correo: { type: string, format: email }
                cedula: { type: string }
      responses:
        "201":
          description: Cita creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cita"
        "400": { description: Datos inválidos u horario inexistente }
        "401": { description: Falta autenticación }
        "403": { description: Se requiere rol paciente o médico de la agenda }
        "409": { description: Horario ya reservado }
    get:
      tags: [Citas]
      summary: Listar citas del paciente autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Citas del paciente
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Cita"
                    - type: object
                      properties:
                        medicoNombre: { type: string }
        "401": { description: Falta autenticación }
        "403": { description: Se requiere rol paciente }

  /citas/{id}/cancelar:
    put:
      tags: [Citas]
      summary: Cancelar cita propia (rol paciente)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cita cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cita"
        "401": { description: Falta autenticación }
        "403": { description: Cita ajena o rol incorrecto }
        "404": { description: Cita no encontrada }

  /citas/{id}/estado:
    put:
      tags: [Citas]
      summary: Actualizar estado de cita
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [CONFIRMADA, CANCELADA, ATENDIDA] }
      responses:
        "200": { description: Estado actualizado }
        "403": { description: No autorizado para esta cita }

  /citas/{id}/reprogramar:
    put:
      tags: [Citas]
      summary: Reprogramar cita propia (rol paciente)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha, hora]
              properties:
                fecha: { type: string, format: date, example: "2026-10-01" }
                hora: { type: string, example: "09:30" }
      responses:
        "200":
          description: Cita reprogramada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cita"
        "400": { description: Datos inválidos, cita cancelada u horario inexistente }
        "401": { description: Falta autenticación }
        "403": { description: Cita ajena o rol incorrecto }
        "404": { description: Cita no encontrada }
        "409": { description: Nuevo horario ya reservado }

  /citas/medico:
    get:
      tags: [Citas]
      summary: Consultar agenda del médico autenticado
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: fecha
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Agenda del médico }
        "401": { description: Falta autenticación }
        "403": { description: Se requiere rol médico }

  /citas/proximas:
    get:
      tags: [Citas]
      summary: Consultar las próximas ocho citas visibles para la cuenta autenticada
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Próximas citas activas }
        "401": { description: Falta autenticación }
        "403": { description: La cuenta no tiene hospital o agenda asociada }

  /citas/todas:
    get:
      tags: [Citas]
      summary: Consultar citas del hospital (personal) o de toda la red (ADMIN_SISTEMA)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: fecha
          required: false
          schema: { type: string, format: date }
      responses:
        "200": { description: Citas visibles para el rol autenticado }
        "401": { description: Falta autenticación }
        "403": { description: Se requiere rol administrativo }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UsuarioPublico:
      type: object
      required: [id, nombre, correo, rol, medicoId]
      properties:
        id: { type: integer }
        nombre: { type: string }
        correo: { type: string, format: email }
        rol: { type: string, enum: [ADMIN_SISTEMA, PERSONAL_ADMINISTRATIVO, MEDICO, PACIENTE] }
        medicoId: { type: integer, nullable: true }
        hospitalId: { type: integer, nullable: true }
        cedula: { type: string, nullable: true }
        fotoUrl: { type: string, format: uri, nullable: true }
    RespuestaAutenticacion:
      type: object
      required: [token, usuario]
      properties:
        token: { type: string }
        usuario:
          $ref: "#/components/schemas/UsuarioPublico"
    Medico:
      type: object
      required: [id, nombre, especialidad]
      properties:
        id: { type: integer }
        nombre: { type: string }
        especialidad: { type: string }
    HorarioBase:
      type: object
      required: [id, medicoId, hora]
      properties:
        id: { type: integer }
        medicoId: { type: integer }
        hora: { type: string, example: "09:00" }
    MedicoConHorarios:
      allOf:
        - $ref: "#/components/schemas/Medico"
        - type: object
          properties:
            horarios:
              type: array
              items:
                $ref: "#/components/schemas/HorarioBase"
    Cita:
      type: object
      required: [id, pacienteId, medicoId, hospitalId, servicioId, fecha, hora, fechaHora, estado, creadaEn]
      properties:
        id: { type: integer }
        pacienteId: { type: integer }
        medicoId: { type: integer }
        hospitalId: { type: integer }
        servicioId: { type: integer }
        fechaHora: { type: string, format: date-time }
        fecha: { type: string, format: date }
        hora: { type: string, example: "09:00" }
        estado: { type: string, enum: [PENDIENTE, CONFIRMADA, CANCELADA, ATENDIDA] }
        creadaEn: { type: string, format: date-time }
